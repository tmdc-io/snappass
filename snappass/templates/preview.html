{% extends "base.html" %}

{% block content %}
<div class="snappass-container">
  <div class="unified-card">
    <div class="card-header">
      <h1>{{ _('Secret') }}</h1>
      <p class="card-description">{{ _('You can only reveal the secret once!') }}</p>
    </div>
    
    <div class="card-content">
      <div class="form-group" style="text-align: center; padding: var(--spacing-2xl) 0;">
        <button id="revealSecret" type="button" class="btn btn-primary btn-lg">{{ _('Reveal secret') }}</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='clipboardjs/clipboard.min.js') }}"></script>
<script src="{{ url_for('static', filename='snappass/scripts/clipboard_button.js') }}"></script>
<script src="{{ url_for('static', filename='snappass/scripts/preview.js') }}"></script>
{% endblock %}
