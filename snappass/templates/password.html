{% extends "base.html" %}

{% block content %}
<div class="snappass-container">
  <div class="unified-card">
    <div class="card-header">
      <h1>{{ _('Secret') }}</h1>
      <p class="card-description">{{ _('Save the following secret to a secure location.') }}</p>
    </div>
    
    <div class="card-content">
      <div class="form-group">
        <textarea 
          class="form-control secret-textarea" 
          id="password-text" 
          name="password-text" 
          readonly="readonly">{{ password }}</textarea>
      </div>

      <div class="link-container">
        <button 
          title="{{ _('Copy to clipboard') }}" 
          type="button" 
          class="btn btn-primary btn-copy"
          id="copy-clipboard-btn" 
          data-clipboard-target="#password-text">
          <i class="fa fa-clipboard"></i> {{ _('Copy Secret') }}
        </button>
      </div>
      
      <p style="text-align: center; color: var(--text-secondary); font-size: var(--font-size-sm); margin-top: var(--spacing-lg);">
        {{ _('Copy and keep this as secret with you.') }}
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='clipboardjs/clipboard.min.js') }}"></script>
<script src="{{ url_for('static', filename='snappass/scripts/clipboard_button.js') }}"></script>
{% endblock %}
